# Railway config — uses Dockerfile (production), NOT next dev

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
healthcheckPath = "/auth/login"
healthcheckTimeout = 600
healthcheckInterval = 15

[env]
NODE_ENV = "production"
AUTH_TRUST_HOST = "true"
